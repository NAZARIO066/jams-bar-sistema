{% extends 'base.html' %}
{% block title %}Alterar senha{% endblock %}
{% block page_title %}Segurança da conta{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
  <section class="card p-6">
    <div class="flex items-start gap-3 mb-5">
      <span class="icon-shell"><i data-lucide="key-round" aria-hidden="true"></i></span>
      <div>
        <h2 class="section-title">Defina sua nova senha</h2>
        <p class="page-lead" style="margin:.35rem 0 0">Use pelo menos 6 caracteres. Sua sessão continuará protegida após a troca.</p>
      </div>
    </div>
    <form method="post" class="space-y-4">
      <input type="hidden" name="_csrf_token" value="{{ csrf_token }}">
      <div>
        <label class="text-sm font-medium" for="senha">Nova senha</label>
        <input class="w-full px-3 py-2 mt-1" id="senha" name="senha" type="password" minlength="6" autocomplete="new-password" required autofocus>
      </div>
      <div>
        <label class="text-sm font-medium" for="confirmacao">Confirmar nova senha</label>
        <input class="w-full px-3 py-2 mt-1" id="confirmacao" name="confirmacao" type="password" minlength="6" autocomplete="new-password" required>
      </div>
      <button class="btn btn-primary w-full" type="submit"><i data-lucide="shield-check" aria-hidden="true"></i>Salvar nova senha</button>
    </form>
  </section>
</div>
{% endblock %}
